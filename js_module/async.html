<script>
    async function loadUsers()
    try {
        const response = await fetch(
            "https://jsonplaceholder.typicode.com/users"
        );

        if(!response.ok){
            throw new Error('HTTP ${response.status}');
        }

        const users = await response.json(){

            console.log(users);
        } catch(error){
            console.error(error);
        }
    }
</script>
